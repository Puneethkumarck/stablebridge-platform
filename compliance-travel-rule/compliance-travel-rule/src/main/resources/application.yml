spring:
  application:
    name: compliance-travel-rule

  config:
    import: optional:vault://

  cloud:
    vault:
      enabled: ${app.vault.enabled:false}
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:https}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: secret
        default-context: application
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: false
      bindings:
        compliance-result-out-0:
          destination: compliance.result
        sanctions-hit-out-0:
          destination: sanctions.hit

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/s2_compliance}
    username: ${DB_USER:sp_user}
    password: ${DB_PASS:sp_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    schemas: public

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

namastack:
  outbox:
    poll-interval: 2000
    batch-size: 20
    jdbc:
      table-prefix: "compliance_"
      schema-initialization:
        enabled: false
    retry:
      policy: exponential
      max-retries: 5
      exponential:
        initial-delay: 1000
        max-delay: 60000
        multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: compliance-travel-rule
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /compliance
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: S2 Compliance & Travel Rule API
    description: Compliance checks, sanctions screening, AML analysis, and FATF Travel Rule enforcement
    version: 1.0.0

app:
  sanctions:
    ofac-sdn:
      base-url: ${OFAC_SDN_BASE_URL:https://www.treasury.gov/ofac/downloads}
      sdn-file-name: ${OFAC_SDN_FILE_NAME:sdn.xml}
      match-threshold: ${OFAC_SDN_MATCH_THRESHOLD:0.85}
      cache-refresh-hours: ${OFAC_SDN_CACHE_REFRESH_HOURS:24}
      connection-timeout-ms: ${OFAC_SDN_CONNECTION_TIMEOUT:10000}
      read-timeout-ms: ${OFAC_SDN_READ_TIMEOUT:30000}

  travel-rule:
    notabene:
      base-url: ${NOTABENE_BASE_URL:https://api.notabene.id}
      auth-url: ${NOTABENE_AUTH_URL:https://auth.notabene.id/oauth/token}
      client-id: ${NOTABENE_CLIENT_ID:}
      client-secret: ${NOTABENE_CLIENT_SECRET:}
      audience: ${NOTABENE_AUDIENCE:https://api.notabene.id}
      vasp-did: ${NOTABENE_VASP_DID:}
      timeout-seconds: ${NOTABENE_TIMEOUT:5}

  compliance:
    risk-scoring:
      kyc-tier1-penalty: 20
      high-value-penalty: 15
      aml-flag-penalty: 30
      cross-border-penalty: 10
      new-customer-penalty: 15
      high-corridor-risk-penalty: 20
      amount-to-limit-ratio-penalty: 10
      high-velocity-penalty: 15
      corridor-risk-scores:
        US-IR: 25
        US-KP: 30
        US-SY: 25
        US-CU: 20

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
  bulkhead:
    instances:
      sanctions:
        maxConcurrentCalls: 5
        maxWaitDuration: 500ms
      kyc:
        maxConcurrentCalls: 5
        maxWaitDuration: 500ms
      aml:
        maxConcurrentCalls: 5
        maxWaitDuration: 500ms
      travel-rule:
        maxConcurrentCalls: 5
        maxWaitDuration: 500ms
  retry:
    retry-aspect-order: 3
    instances:
      sanctions:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
          - java.net.http.HttpConnectTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      kyc:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
          - java.net.http.HttpConnectTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      aml:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
          - java.net.http.HttpConnectTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      travel-rule:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
          - java.net.http.HttpConnectTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

logging:
  level:
    com.stablecoin.payments: INFO
    org.springframework.security: WARN
