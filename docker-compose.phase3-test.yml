# Phase 3 E2E Test — Full Payment Sandwich (S1 + S2 + S3 + S4 + S5 + S6 + S7)
#
# Usage:
#   ./gradlew jibDockerBuild                          # Build all images
#   docker compose -f docker-compose.phase3-test.yml up -d
#   docker compose -f docker-compose.phase3-test.yml ps
#   docker compose -f docker-compose.phase3-test.yml down -v
#
# Memory budget (~7.5 GB total):
#   Infrastructure: ~3 GB (Postgres, TimescaleDB, Redis, Redpanda, Temporal, WireMock)
#   Application:    ~3.5 GB (7 services × 512M)
#   Headroom:       ~5 GB for host OS, IDE, Gradle

services:

  # ── Infrastructure ─────────────────────────────────────────────

  postgres:
    image: postgres:18-alpine
    container_name: p3t-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: postgres
    volumes:
      - ./infra/local/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: p3t-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fx_rates
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: p3t-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    container_name: p3t-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    container_name: p3t-kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      rpk --brokers redpanda:29092 topic create payment.initiated --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create compliance.result --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create fx.rate.locked --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create fiat.collected --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create fiat.collection.failed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create chain.transfer.submitted --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create chain.transfer.confirmed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create stablecoin.redeemed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create fiat.payout.initiated --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create fiat.payout.completed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create fiat.payout.failed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create payment.completed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create payment.failed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create reconciliation.completed --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create reconciliation.discrepancy --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create audit.event --partitions 3 --replicas 1 &&
      rpk --brokers redpanda:29092 topic create merchant.activated --partitions 3 --replicas 1 &&
      echo 'All topics created'
      "
    restart: on-failure

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: p3t-temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: dev
      POSTGRES_PWD: dev
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health 2>/dev/null | grep -q 'OK' || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 15

  temporal-ui:
    image: temporalio/ui:2.35.0
    container_name: p3t-temporal-ui
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  wiremock:
    image: wiremock/wiremock:3.13.0
    container_name: p3t-wiremock
    ports:
      - "4444:8080"
    volumes:
      - ./infra/local/wiremock/mappings:/home/wiremock/mappings
      - ./infra/local/wiremock/__files:/home/wiremock/__files
    command: --verbose --global-response-templating
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ── Phase 2 Services (S1, S2, S6) ───────────────────────────────

  compliance-travel-rule:
    image: stablebridge/compliance-travel-rule:latest
    container_name: p3t-compliance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://postgres:5432/s2_compliance"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      APP_SECURITY_ENABLED: "false"
      APP_FALLBACK_ADAPTERS_ENABLED: "true"
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/compliance/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  fx-liquidity-engine:
    image: stablebridge/fx-liquidity-engine:latest
    container_name: p3t-fx-engine
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://timescaledb:5432/fx_rates"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_SECURITY_ENABLED: "false"
      APP_FALLBACK_ADAPTERS_ENABLED: "true"
    ports:
      - "8084:8084"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/fx/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  payment-orchestrator:
    image: stablebridge/payment-orchestrator:latest
    container_name: p3t-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      temporal:
        condition: service_healthy
      compliance-travel-rule:
        condition: service_started
      fx-liquidity-engine:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://postgres:5432/s1_payment_orchestrator"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: default
      COMPLIANCE_SERVICE_URL: "http://compliance-travel-rule:8083/compliance"
      FX_SERVICE_URL: "http://fx-liquidity-engine:8084/fx"
      ONRAMP_SERVICE_URL: "http://fiat-on-ramp:8085/on-ramp"
      CUSTODY_SERVICE_URL: "http://blockchain-custody:8086/custody"
      OFFRAMP_SERVICE_URL: "http://fiat-off-ramp:8087/off-ramp"
      LEDGER_SERVICE_URL: "http://ledger-accounting:8088/ledger"
      APP_SECURITY_ENABLED: "false"
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/orchestrator/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  # ── Phase 3 Services (S3, S4, S5, S7) ───────────────────────────

  fiat-on-ramp:
    image: stablebridge/fiat-on-ramp:latest
    container_name: p3t-onramp
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://postgres:5432/s3_fiat_on_ramp"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      APP_SECURITY_ENABLED: "false"
      APP_PSP_PROVIDER: stripe
      APP_PSP_STRIPE_BASEURL: "http://wiremock:8080"
      STRIPE_API_KEY: "sk_test_default"
      STRIPE_WEBHOOK_SECRET: "whsec_test_default"
    ports:
      - "8085:8085"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/on-ramp/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  blockchain-custody:
    image: stablebridge/blockchain-custody:latest
    container_name: p3t-custody
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://postgres:5432/s4_blockchain_custody"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      APP_SECURITY_ENABLED: "false"
      APP_CUSTODY_PROVIDER: dev
      APP_FALLBACK_ADAPTERS_ENABLED: "true"
    ports:
      - "8086:8086"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8086/custody/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  fiat-off-ramp:
    image: stablebridge/fiat-off-ramp:latest
    container_name: p3t-offramp
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://postgres:5432/s5_fiat_off_ramp"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      APP_SECURITY_ENABLED: "false"
      APP_FALLBACK_ADAPTERS_ENABLED: "true"
    ports:
      - "8087:8087"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8087/off-ramp/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  ledger-accounting:
    image: stablebridge/ledger-accounting:latest
    container_name: p3t-ledger
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xss256k"
      DB_URL: "jdbc:postgresql://postgres:5432/s7_ledger_accounting"
      DB_USER: dev
      DB_PASS: dev
      KAFKA_BROKERS: "redpanda:29092"
      APP_SECURITY_ENABLED: "false"
    ports:
      - "8088:8088"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8088/ledger/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
